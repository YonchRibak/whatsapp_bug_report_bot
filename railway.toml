[build]
# Build with the repo Dockerfile. Railway's Root Directory for this service is
# apps/bot-server, so the Docker build context is that folder and the compiled
# dist/ is baked into the image (nixpacks was unreliable at carrying it).
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
