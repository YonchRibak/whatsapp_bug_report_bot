[build]
# Use the repo-root Dockerfile for a deterministic build. nixpacks' npm-based
# auto-detection conflicted with this pnpm workspace and aborted on pnpm 10's
# ignored-build-scripts gate; the Dockerfile controls the toolchain explicitly.
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
