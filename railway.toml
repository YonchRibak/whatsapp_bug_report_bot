[build]
builder = "nixpacks"
buildCommand = "COREPACK_ENABLE_DOWNLOAD_PROMPT=0 corepack pnpm install --ignore-scripts && COREPACK_ENABLE_DOWNLOAD_PROMPT=0 corepack pnpm build"

[deploy]
# Diagnostic start: show what's on disk, compile tsc directly (bypassing the
# pnpm --filter wrapper) with emitted-file listing, then run.
startCommand = "COREPACK_ENABLE_DOWNLOAD_PROMPT=0 corepack pnpm install --ignore-scripts && echo '---LS SRC---' && ls apps/bot-server/src && echo '---TSC---' && corepack pnpm -C apps/bot-server exec tsc --listEmittedFiles ; echo '---LS DIST---' && ls -la apps/bot-server/dist ; echo '---RUN---' && node apps/bot-server/dist/index.js"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
