[build]
builder = "nixpacks"
# Railway's Root Directory for this service is apps/bot-server, so the build runs
# there (flattened to /app). Invoke pnpm via corepack (bundled with Node) and skip
# dependency build scripts so pnpm 10/11 doesn't abort on its ignored-builds gate;
# esbuild's binary is only for tsx (unused at runtime) and protobufjs's postinstall
# isn't needed by the Vision client. `pnpm build` here runs the bot's tsc.
buildCommand = "COREPACK_ENABLE_DOWNLOAD_PROMPT=0 corepack pnpm install --ignore-scripts && COREPACK_ENABLE_DOWNLOAD_PROMPT=0 corepack pnpm build"

[deploy]
# Path is relative to /app (= apps/bot-server). dist/ is produced by the build
# phase and carried into the runtime image (as the original deployment relied on).
startCommand = "node dist/index.js"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
