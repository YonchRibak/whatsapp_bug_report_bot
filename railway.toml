[build]
builder = "nixpacks"
# Invoke pnpm through corepack (bundled with Node) so the build doesn't depend on
# nixpacks auto-provisioning pnpm. --ignore-scripts skips dependency build scripts
# (esbuild's native binary is only for tsx, which we don't run; protobufjs's
# postinstall isn't needed by the Vision client) so pnpm 10 doesn't abort on its
# ignored-build-scripts gate. Our own `pnpm build` (tsc) still runs normally.
buildCommand = "COREPACK_ENABLE_DOWNLOAD_PROMPT=0 corepack pnpm install --ignore-scripts && COREPACK_ENABLE_DOWNLOAD_PROMPT=0 corepack pnpm build"

[deploy]
# Run the built output directly with node — no pnpm needed at runtime. Env comes
# from Railway; the app has no cwd-relative file reads, so repo-root cwd is fine.
startCommand = "node apps/bot-server/dist/index.js"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
