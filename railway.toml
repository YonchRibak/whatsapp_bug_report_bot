[build]
# Build with the repo Dockerfile. Railway's Root Directory for this service is
# apps/bot-server, so the Docker build context is that folder and the compiled
# dist/ is baked into the image (nixpacks was unreliable at carrying it).
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# Explicit start (overrides any stale service-level start command). Build context is
# the repo root, so the compiled entry is at apps/bot-server/dist/index.js under /app.
startCommand = "node apps/bot-server/dist/index.js"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
