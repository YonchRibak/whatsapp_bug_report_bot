packages:
  - 'apps/*'

# pnpm 10 does not run dependency build scripts unless allow-listed. Newer pnpm
# reads this from pnpm-workspace.yaml (older from package.json's pnpm field); we
# declare it in both so esbuild/protobufjs postinstalls run and install exits clean.
onlyBuiltDependencies:
  - esbuild
  - protobufjs
